<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title></title>
	</head>
	<body>
		<div class="body">
			<button onclick="getGenerateSSQ(1)">随机1注</button>
			<button onclick="getGenerateSSQ(5)">随机5注</button>
			<button onclick="getGenerateSSQ(10)">随机10注</button>
			<!-- <div id="content"></div> -->
			<div class="popup">
				<div class="mask"></div>
				<div class="popup-content">
					<div id="content"></div>
					<div class="popup-footer">
						<div class="close" onclick="closePopup()">关闭</div>
						<div class="copy" onclick="copy()">复制</div>
					</div>
				</div>
			</div>
			<div class="toast">复制成功</div>
		</div>
	</body>
	<script>
		function closePopup() {
			let popup = document.querySelector('.popup')
			popup.style.display = 'none'
		}

		function copy() {
			const content = document.getElementById('content');
			// 获取纯文本，将<br>替换为换行符，去除其他HTML标签
			const text = content.innerHTML.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
			if (navigator.clipboard) {
				navigator.clipboard.writeText(text).then(function() {
					let toast = document.querySelector('.toast')
					toast.style.display = 'block'
					setTimeout(() => {
						toast.style.display = 'none'

					}, 2000)
					console.log('文本已成功复制到剪贴板');
				}).catch(function(error) {
					console.error('复制文本到剪贴板失败:', error);
				});
			} else {
				console.log('当前浏览器不支持 navigator.clipboard API');
			}
			console.log(text); // 打印复制的文本
		}


		function generateSSQ() {
			// 生成红球（1-33选6个不重复）
			const redBalls = Array.from({
				length: 33
			}, (_, i) => i + 1);
			for (let i = redBalls.length - 1; i > 0; i--) {
				const j = Math.floor(Math.random() * (i + 1));
				[redBalls[i], redBalls[j]] = [redBalls[j], redBalls[i]]; // Fisher-Yates 洗牌算法
			}
			const selectedRed = redBalls.slice(0, 6).sort((a, b) => a - b);

			// 生成蓝球（1-16选1个）
			const blueBall = Math.floor(Math.random() * 16) + 1;

			return {
				red: selectedRed,


				blue: blueBall,
				toString: function() {
					const formattedRed = this.red.map(n => n.toString().padStart(2, '0')).join(' ');
					const formattedBlue = this.blue.toString().padStart(2, '0');
					return `${formattedRed}  + ${formattedBlue}`;
				}
			};
		}



		function getGenerateSSQ(num) {
			let popup = document.querySelector('.popup')
			popup.style.display = 'block'
			let str = ''
			for (let i = 0; i < num; i++) {
				const res = generateSSQ().toString()
				str = str + res + '<br/>'
			}

			const content = document.getElementById('content')
			content.innerHTML = str
		}

		// 使用示例
		const ssq = generateSSQ();
		console.log(ssq.toString());
		// 示例输出：红球：03 08 11 14 25 28 | 蓝球：12
		console.log(ssq); // 查看原始数据格式
	</script>
	<style>
		html {
			font-size: 16px;
		}

		* {
			padding: 0;
			margin: 0;
		}

		.body {
			background: url('images/facai.png') no-repeat;
			background-size: 100% 100%;
			height: 100vh;
			width: 100vw;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding: 2rem;
			box-sizing: border-box;
		}

		button {
			width: 80%;
			font-size: 1rem;
			border: none;
			display: block;
			padding: 0.4rem 0;
			border-radius: 4px;
			margin-bottom: 1rem;
		}

		.popup {
			position: absolute;
			top: 0;
			display: flex;
			align-items: center;
			width: 100vw;
			height: 100vh;
			display: none;
		}

		.mask {
			position: absolute;
			top: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.1);
		}

		.popup-content {
			position: absolute;
			width: 80vw;
			margin-top: 30vh;
			left: 10vw;
			background: #fff;
			overflow: hidden;
			box-sizing: border-box;
			border-radius: 6px;
			z-index: 9999;

		}

		#content {
			text-align: center;
			color: #333;
			padding: 20px 0;
		}

		.popup-footer {
			display: flex;
			border-top: 1px solid #eee;
		}

		.popup-footer>div {
			flex: 1;
			padding: 0.6rem 0;
			text-align: center;
		}

		.copy {
			background-color: #f29024;
			color: #fff;
		}

		.toast {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			display: none;
			background: rgba(0, 0, 0, 0.8);
			padding: 10px;
			color: #fff;
		}
	</style>
</html>
